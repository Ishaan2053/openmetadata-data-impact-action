name: Release Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Upload bundled action artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-bundle
          path: bundle

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: bundle/index.js

      - name: Compute release channel tags
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "is_semver_tag=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease_tag=false" >> "$GITHUB_OUTPUT"
            echo "major_tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            if [[ -n "${BASH_REMATCH[4]}" ]]; then
              echo "is_prerelease_tag=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_semver_tag=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease_tag=false" >> "$GITHUB_OUTPUT"
            echo "major_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update moving major tag
        if: steps.release_meta.outputs.is_semver_tag == 'true'
        shell: bash
        run: |
          if [[ "${{ steps.release_meta.outputs.is_prerelease_tag }}" == "true" ]]; then
            echo "Skipping moving major tag update for prerelease ${GITHUB_REF_NAME}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.release_meta.outputs.major_tag }}" "${GITHUB_REF_NAME}"
          git push origin "refs/tags/${{ steps.release_meta.outputs.major_tag }}" --force

      - name: Create or update GitHub release
        if: steps.release_meta.outputs.is_semver_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            if [[ "${{ steps.release_meta.outputs.is_prerelease_tag }}" == "true" ]]; then
              gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --prerelease --title "${GITHUB_REF_NAME}"
            else
              gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --latest --title "${GITHUB_REF_NAME}"
            fi
          fi

      - name: Attach bundle asset to release
        if: steps.release_meta.outputs.is_semver_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" "bundle/index.js#openmetadata-impact-action-bundle.js" --clobber
