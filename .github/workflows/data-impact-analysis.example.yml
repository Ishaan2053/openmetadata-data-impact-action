name: Data Impact Analysis (Example)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: data-impact-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run OpenMetadata impact analysis
        id: impact
        uses: ./. 
        with:
          openmetadata-endpoint: ${{ secrets.OPENMETADATA_ENDPOINT }}
          auth-token: ${{ secrets.OPENMETADATA_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file-patterns: |
            **/*.sql
            **/models/**/*.sql
            **/schema.yml
            **/schema.yaml
          max-lineage-depth: "3"
          max-concurrency: "4"
          max-tracked-files: "200"
          max-entities: "500"
          max-downstream-assets: "2000"
          fail-on-missing-metadata: "false"
          lineage-provider: "auto"
          strict-sql-parse: "false"
          critical-asset-tags: |
            tier1
            critical
          ai-summary-enabled: "false"
          impact-json-file: .artifacts/impact-analysis.json

      - name: Upload structured impact JSON
        if: steps.impact.outputs.impact-json-file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impact-analysis
          path: ${{ steps.impact.outputs.impact-json-file }}